<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scarica logo My Class</title>
    <style>
      body {
        align-items: center;
        background: #f7f8f3;
        color: #14513e;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        text-align: center;
      }

      img {
        display: block;
        height: 180px;
        margin: 0 auto 24px;
        width: 180px;
      }

      a {
        background: #14513e;
        border-radius: 8px;
        color: white;
        display: inline-block;
        font-size: 18px;
        font-weight: 700;
        padding: 14px 22px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/my-class-logo.svg" alt="Logo My Class">
      <a href="/my-class-logo.svg" download="my-class-logo.svg">Scarica logo</a>
    </main>
  </body>
</html>
